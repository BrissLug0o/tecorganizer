services:
  - type: web
    name: tecorganizer-api
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tecorganizer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: tecorganizer-db
    plan: free